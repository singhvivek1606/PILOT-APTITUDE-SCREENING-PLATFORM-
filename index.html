<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AeroVector — professional pilot aptitude screening platform.">
  <title>AeroVector — Pilot Aptitude Screening</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" data-page="home" href="#home" aria-label="AeroVector home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none">
            <path d="M22 4 39 38 22 29 5 38 22 4Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M22 15v21" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </span>
        <span class="brand-text">AEROVECTOR<small>Pilot Aptitude Screening</small></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">Menu</button>

      <nav id="nav" class="main-nav" aria-label="Primary">
        <button data-page="home">Overview</button>
        <button data-page="tests">Assessments</button>
        <button data-page="results">Results</button>
        <button data-page="history">History</button>
        <button data-page="settings">Controls</button>
      </nav>

      <div class="header-status" id="headerStatus" aria-live="polite"></div>
      <button id="themeToggle" class="btn secondary" type="button" aria-label="Toggle dark mode" aria-pressed="true">Light mode</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="app-footer">
    <span>AeroVector · Pilot Aptitude Screening Platform</span>
    <span class="footer-meta">Training &amp; hackathon prototype — not an official selection system</span>
  </footer>

  <div id="notice" class="toast" role="status" aria-live="polite" hidden></div>

    <script defer src="js/core.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/screens.js"></script>
  <script defer src="js/assessment.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
