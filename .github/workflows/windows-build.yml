name: Build Windows desktop app
on:
  workflow_dispatch:
  push:
    branches: ['feature/functional-assessment-suite-v2']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron build dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript and assessments
        run: |
          npm run check
          npm test
      - name: Package Windows installer and portable executable
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: aerovector-windows-build
          path: dist/*.exe
          if-no-files-found: error
