name: Validate native-capable assessment app
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.js
          node --check frontend.js
          node --check core.mjs
          node --check assessment-core.mjs
          node --check assessment-runtime.mjs
          node --check electron/main.cjs
      - name: Run unit tests
        run: node --test tests/*.test.mjs
